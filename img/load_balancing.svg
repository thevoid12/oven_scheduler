<rect x="700" y="114" width="270" height="32" rx="6" fill="none" stroke="#000" stroke-width="1"/>
<text x="710" y="134.0" font-size="13" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">dl_rq, rt_rq   (higher classes)</text>
