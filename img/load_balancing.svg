<rect x="710" y="196" width="58" height="58" rx="6" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="6 5"/>
<text x="809.0" y="227.0" font-size="13" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">empty -&gt; idle</text>
<text x="840" y="282.0" font-size="14" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">nr_running = 0</text>
<rect x="700" y="316" width="270" height="32" rx="6" fill="none" stroke="#000" stroke-width="1"/>
<text x="710" y="336.0" font-size="13" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">cfs_rq   (lower class)</text>
<polyline points="143.0,254 143.0,405 739.0,405 739.0,258" fill="none" stroke="#000" stroke-width="2" marker-end="url(#ah)"/>
<text x="441.0" y="425.0" font-size="15" text-anchor="middle" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive" font-weight="bold">pull 1 task: shortest waiting job</text>
<text x="30" y="466.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">1. CPU 2 has nothing to run</text>
<text x="30" y="486.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">2. It finds the busiest CPU  -&gt;  CPU 0</text>
<text x="30" y="506.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">3. It locks both queues safely</text>
<text x="30" y="526.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">4. It takes the shortest waiting job  -&gt;  fib35</text>
<text x="30" y="546.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">5. fib35 now runs on CPU 2</text>
<text x="30" y="566.0" font-size="16" text-anchor="start" font-family="Virgil, 'Comic Sans MS', 'Segoe Print', cursive">Small weight = short job = runs first</text></svg>
